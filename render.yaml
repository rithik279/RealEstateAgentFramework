services:
  - type: web
    name: anukabli-site
    runtime: static
    staticPublishPath: site
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /privacy
        destination: /privacy.html
      - type: rewrite
        source: /terms
        destination: /terms.html
      - type: rewrite
        source: /rosedale-village-brampton
        destination: /rosedale-village-brampton.html
      - type: rewrite
        source: /northwood-park-brampton
        destination: /northwood-park-brampton.html
      - type: rewrite
        source: /castlemore-brampton
        destination: /castlemore-brampton.html
      - type: rewrite
        source: /brampton-east-homes-for-sale
        destination: /brampton-east-homes-for-sale.html
      - type: rewrite
        source: /mount-pleasant-brampton
        destination: /mount-pleasant-brampton.html
      - type: rewrite
        source: /credit-valley-brampton
        destination: /credit-valley-brampton.html
      - type: rewrite
        source: /hamilton-homes-for-sale
        destination: /hamilton-homes-for-sale.html
      - type: rewrite
        source: /ancaster-homes-for-sale
        destination: /ancaster-homes-for-sale.html
      - type: rewrite
        source: /vaughan-real-estate
        destination: /vaughan-real-estate.html
      - type: rewrite
        source: /kleinburg-homes-for-sale
        destination: /kleinburg-homes-for-sale.html
      - type: rewrite
        source: /caledon-real-estate
        destination: /caledon-real-estate.html
      - type: rewrite
        source: /bolton-homes-for-sale
        destination: /bolton-homes-for-sale.html
      - type: rewrite
        source: /king-township-real-estate
        destination: /king-township-real-estate.html
      - type: rewrite
        source: /king-city-homes-for-sale
        destination: /king-city-homes-for-sale.html
      - type: rewrite
        source: /nobleton-homes-for-sale
        destination: /nobleton-homes-for-sale.html
