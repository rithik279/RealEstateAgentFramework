services:
  - type: web
    name: anukabli-site
    runtime: static
    staticPublishPath: site
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /privacy
        destination: /privacy.html
      - type: rewrite
        source: /terms
        destination: /terms.html

  - type: web
    name: real-estate-agent
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DRY_RUN
        value: "false"
      - key: PYTHONPATH
        value: "."
      - key: DATABASE_URL
        fromDatabase:
          name: real-estate-db
          property: connectionString
      # --- Set these manually in Render dashboard ---
      # OPENAI_API_KEY
      # OPENAI_MODEL = gpt-4o-mini
      # EMBEDDING_MODEL = text-embedding-3-small
      # COPILOT_TOP_K = 5
      # TWILIO_ACCOUNT_SID
      # TWILIO_AUTH_TOKEN
      # TWILIO_FROM_NUMBER
      # OWNER_ALERT_PHONE
      # RETELL_API_KEY
      # RETELL_AGENT_ID_EN
      # META_VERIFY_TOKEN
      # META_APP_SECRET
      # META_ACCESS_TOKEN
      # CALENDLY_BOOKING_URL
      # COMPANY_NAME
      # ADVISOR_NAME
      # --- Control Center Auth ---
      # Run: python scripts/gen_admin_hash.py  → paste output here
      # ADMIN_PASSWORD_HASH
      # SECRET_KEY  (python -c "import secrets; print(secrets.token_hex(32))")
      # SESSION_TTL_HOURS = 24
      # --- PropTx RESO API (MLS data — contact support@proptx.ca) ---
      # PROPTX_BASE_URL = https://query.ampre.ca/odata
      # PROPTX_API_KEY  (preferred — PropTx provides after agreement approval)
      # PROPTX_USER     (fallback basic auth)
      # PROPTX_PASSWORD (fallback basic auth)
      - key: APP_TIMEZONE
        value: America/Toronto
      - key: CALL_WINDOW_START_HOUR
        value: "9"
      - key: CALL_WINDOW_END_HOUR
        value: "20"

databases:
  - name: real-estate-db
    databaseName: realestate
    plan: free
    # Note: Upgrade to "starter" ($7/mo) for production — free tier has limited connections
